<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cargar artículo — ciudadhub blog</title>
<style>
  :root {
    --bg: #09090b;
    --card: #18181b;
    --card-2: #1f1f23;
    --border: #27272a;
    --border-2: #3f3f46;
    --text: #fafafa;
    --muted: #a1a1aa;
    --muted-2: #71717a;
    --orange: #f97316;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(9,9,11,0.92);
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  header p.eyebrow {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--orange);
    margin: 0 0 4px;
  }
  header h1 { margin: 0; font-size: 22px; }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 0;
  }
  @media (min-width: 1100px) {
    .layout { grid-template-columns: minmax(0, 480px) minmax(0, 1fr); }
  }

  .form-col { padding: 24px; max-width: 640px; }
  .preview-col {
    padding: 24px;
    border-left: 1px solid var(--border);
    background: #0c0c0e;
  }
  @media (max-width: 1099px) {
    .preview-col { border-left: none; border-top: 1px solid var(--border); }
  }

  .field { margin-bottom: 18px; }
  label.field-label {
    display: block;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted-2);
    margin-bottom: 6px;
  }
  input[type=text], input[type=date], textarea, select {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border-2);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--orange);
  }
  .row { display: flex; gap: 12px; }
  .row > .field { flex: 1; }

  .tags-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tag-check {
    display: none;
  }
  .tag-check + label {
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border-2);
    font-size: 13px;
    color: var(--muted);
    user-select: none;
  }
  .tag-check:checked + label {
    background: var(--orange);
    color: #09090b;
    border-color: var(--orange);
    font-weight: 600;
  }

  .block-card {
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .block-card .block-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .block-type-badge {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--orange);
  }
  .btn {
    appearance: none;
    border: 1px solid var(--border-2);
    background: transparent;
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 7px;
    font-size: 13px;
    cursor: pointer;
  }
  .btn:hover { color: var(--text); border-color: var(--muted); }
  .btn.icon { padding: 4px 8px; }
  .btn.danger:hover { color: #f87171; border-color: #f87171; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 22px; }
  .btn-row .btn { color: var(--text); }

  .stat-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .stat-row input { flex: 1; }

  .primary {
    background: var(--orange);
    color: #09090b;
    border: none;
    font-weight: 700;
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
  }
  .primary:hover { filter: brightness(1.08); }
  .primary:disabled { opacity: 0.5; cursor: default; }

  #status { margin-top: 14px; font-size: 14px; line-height: 1.5; }
  #status.ok { color: #4ade80; }
  #status.err { color: #f87171; white-space: pre-line; }
  #status a { color: var(--orange); }

  /* --- preview --- */
  .p-eyebrow { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted-2); margin-bottom: 10px; }
  .p-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .p-tags span { padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 500; border: 1px solid rgba(249,115,22,0.3); background: rgba(249,115,22,0.1); color: #fb923c; }
  .p-title { font-size: 28px; font-weight: 700; line-height: 1.15; margin: 0 0 14px; letter-spacing: -0.01em; }
  .p-summary { font-size: 16px; color: var(--muted); line-height: 1.6; margin-bottom: 14px; }
  .p-meta { font-size: 13px; color: var(--muted-2); padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; display: flex; gap: 14px; }
  .p-cover { width: 100%; aspect-ratio: 16/7; border-radius: 12px; overflow: hidden; margin-bottom: 24px; background: #111; }
  .p-cover svg { width: 100%; height: 100%; display: block; }
  .p-body p { font-size: 15px; line-height: 1.7; color: #d4d4d8; margin-bottom: 16px; }
  .p-quote { border-left: 2px solid var(--orange); padding-left: 16px; margin: 22px 0; }
  .p-quote .mark { color: rgba(249,115,22,0.4); font-size: 26px; display: block; margin-bottom: 4px; }
  .p-quote p { font-size: 19px; font-weight: 600; color: var(--text); margin: 0; }
  .p-stats { border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 18px; margin: 22px 0; }
  .p-stats .stitle { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted-2); margin-bottom: 14px; }
  .p-stats .sgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px; }
  .p-stats .sval { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 26px; font-weight: 700; color: var(--orange); margin: 0 0 4px; }
  .p-stats .slabel { font-size: 13px; color: var(--muted); line-height: 1.4; }
  .p-endtags { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 18px; border-top: 1px solid var(--border); }
  .p-endtags span { padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; border: 1px solid var(--border-2); color: var(--muted); }
  .empty-hint { color: var(--muted-2); font-size: 14px; }
</style>
</head>
<body>

<header>
  <p class="eyebrow">ciudadhub / herramienta local</p>
  <h1>Cargar artículo del blog</h1>
</header>

<div class="layout">
  <div class="form-col">
    <form id="post-form">
      <div class="field">
        <label class="field-label">Título</label>
        <input type="text" id="f-title" placeholder="Ej: Movilidad activa: por qué caminar define el futuro urbano" />
      </div>

      <div class="field">
        <label class="field-label">Encabezado resumen (dek)</label>
        <textarea id="f-summary" placeholder="2-3 líneas que resumen de qué trata el artículo."></textarea>
      </div>

      <div class="row">
        <div class="field">
          <label class="field-label">Autor</label>
          <input type="text" id="f-author" value="Redacción ciudadhub" />
        </div>
        <div class="field">
          <label class="field-label">Fecha</label>
          <input type="date" id="f-date" />
        </div>
        <div class="field">
          <label class="field-label">Lectura</label>
          <input type="text" id="f-readtime" value="6 min" />
        </div>
      </div>

      <div class="field">
        <label class="field-label">Tags (elegí uno o más — el primero define el color de portada)</label>
        <div class="tags-grid" id="tags-grid"></div>
      </div>

      <div class="field">
        <label class="field-label">Contenido</label>
        <div id="blocks"></div>
        <div class="btn-row">
          <button type="button" class="btn" data-add="paragraph">+ Párrafo</button>
          <button type="button" class="btn" data-add="quote">+ Cita destacada</button>
          <button type="button" class="btn" data-add="stats">+ Infografía</button>
        </div>
      </div>

      <button type="submit" class="primary">Publicar artículo</button>
      <div id="status"></div>
    </form>
  </div>

  <div class="preview-col">
    <p class="p-eyebrow">Vista previa</p>
    <div id="preview"></div>
  </div>
</div>

<script>
const state = {
  tags: [],
  blocks: [],
};

const TOPIC_COLORS_FALLBACK = {
  "Smart Cities": {h:213,s:94}, "Datos": {h:258,s:89}, "Movilidad": {h:142,s:71},
  "Sostenibilidad": {h:160,s:84}, "Urbanismo": {h:38,s:92}, "Equidad": {h:343,s:88},
  "Gobernanza": {h:199,s:89}, "Salud": {h:173,s:80}, "Innovación": {h:24,s:94},
  "Espacio Público": {h:84,s:81},
};
let TOPIC_COLORS = TOPIC_COLORS_FALLBACK;

function topicStyle(topic, active) {
  const c = TOPIC_COLORS[topic] || { h: 30, s: 60 };
  if (active) return `background:hsl(${c.h} ${c.s}% 55%);color:#09090b;border-color:hsl(${c.h} ${c.s}% 55%);font-weight:600;`;
  return `background:hsl(${c.h} ${c.s}% 50% / 0.1);color:hsl(${c.h} ${c.s}% 75%);border-color:hsl(${c.h} ${c.s}% 50% / 0.25);`;
}

async function loadTopics() {
  try {
    const res = await fetch("/api/topics");
    TOPIC_COLORS = await res.json();
  } catch {
    TOPIC_COLORS = TOPIC_COLORS_FALLBACK;
  }
  renderTagsGrid();
}

function renderTagsGrid() {
  const grid = document.getElementById("tags-grid");
  grid.innerHTML = "";
  Object.keys(TOPIC_COLORS).forEach((tag, i) => {
    const id = `tag-${i}`;
    const input = document.createElement("input");
    input.type = "checkbox";
    input.className = "tag-check";
    input.id = id;
    input.value = tag;
    input.addEventListener("change", onTagsChange);
    const label = document.createElement("label");
    label.setAttribute("for", id);
    label.textContent = tag;
    grid.appendChild(input);
    grid.appendChild(label);
  });
}

function onTagsChange() {
  state.tags = [...document.querySelectorAll(".tag-check:checked")].map((el) => el.value);
  renderPreview();
}

// --- bloques ---
function addBlock(type) {
  if (type === "paragraph") state.blocks.push({ type, text: "" });
  if (type === "quote") state.blocks.push({ type, text: "" });
  if (type === "stats") state.blocks.push({ type, title: "", items: [{ value: "", label: "" }] });
  renderBlocks();
  renderPreview();
}

function moveBlock(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= state.blocks.length) return;
  [state.blocks[i], state.blocks[j]] = [state.blocks[j], state.blocks[i]];
  renderBlocks();
  renderPreview();
}

function removeBlock(i) {
  state.blocks.splice(i, 1);
  renderBlocks();
  renderPreview();
}

function renderBlocks() {
  const wrap = document.getElementById("blocks");
  wrap.innerHTML = "";
  state.blocks.forEach((block, i) => {
    const card = document.createElement("div");
    card.className = "block-card";

    const head = document.createElement("div");
    head.className = "block-head";
    const badge = document.createElement("span");
    badge.className = "block-type-badge";
    badge.textContent = block.type === "paragraph" ? "Párrafo" : block.type === "quote" ? "Cita destacada" : "Infografía";
    const controls = document.createElement("div");
    controls.style.display = "flex";
    controls.style.gap = "4px";
    controls.innerHTML = `
      <button type="button" class="btn icon" data-move="${i}:-1">↑</button>
      <button type="button" class="btn icon" data-move="${i}:1">↓</button>
      <button type="button" class="btn icon danger" data-remove="${i}">×</button>
    `;
    head.appendChild(badge);
    head.appendChild(controls);
    card.appendChild(head);

    if (block.type === "paragraph" || block.type === "quote") {
      const ta = document.createElement("textarea");
      ta.placeholder = block.type === "paragraph" ? "Texto del párrafo…" : "Frase destacada…";
      ta.value = block.text;
      ta.addEventListener("input", (e) => { block.text = e.target.value; renderPreview(); });
      card.appendChild(ta);
    } else if (block.type === "stats") {
      const titleInput = document.createElement("input");
      titleInput.type = "text";
      titleInput.placeholder = "Título de la infografía (ej: La movilidad activa en números)";
      titleInput.value = block.title;
      titleInput.style.marginBottom = "10px";
      titleInput.addEventListener("input", (e) => { block.title = e.target.value; renderPreview(); });
      card.appendChild(titleInput);

      const itemsWrap = document.createElement("div");
      block.items.forEach((item, ii) => {
        const row = document.createElement("div");
        row.className = "stat-row";
        const valInput = document.createElement("input");
        valInput.type = "text";
        valInput.placeholder = "Valor (ej: 54%)";
        valInput.value = item.value;
        valInput.addEventListener("input", (e) => { item.value = e.target.value; renderPreview(); });
        const labelInput = document.createElement("input");
        labelInput.type = "text";
        labelInput.placeholder = "Descripción";
        labelInput.value = item.label;
        labelInput.addEventListener("input", (e) => { item.label = e.target.value; renderPreview(); });
        const rm = document.createElement("button");
        rm.type = "button";
        rm.className = "btn icon danger";
        rm.textContent = "×";
        rm.addEventListener("click", () => { block.items.splice(ii, 1); renderBlocks(); renderPreview(); });
        row.appendChild(valInput);
        row.appendChild(labelInput);
        row.appendChild(rm);
        itemsWrap.appendChild(row);
      });
      card.appendChild(itemsWrap);

      const addStat = document.createElement("button");
      addStat.type = "button";
      addStat.className = "btn";
      addStat.textContent = "+ Estadística";
      addStat.addEventListener("click", () => { block.items.push({ value: "", label: "" }); renderBlocks(); renderPreview(); });
      card.appendChild(addStat);
    }

    wrap.appendChild(card);
  });

  wrap.querySelectorAll("[data-move]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const [i, dir] = btn.dataset.move.split(":").map(Number);
      moveBlock(i, dir);
    });
  });
  wrap.querySelectorAll("[data-remove]").forEach((btn) => {
    btn.addEventListener("click", () => removeBlock(Number(btn.dataset.remove)));
  });
}

document.querySelectorAll("[data-add]").forEach((btn) => {
  btn.addEventListener("click", () => addBlock(btn.dataset.add));
});

// --- portada SVG (misma lógica que components/blog/BlogCover.tsx) ---
function seededRand(seed) {
  let s = seed;
  return () => {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

function coverSvg(hue, title) {
  const rand = seededRand(hue * 97 + (title || "").length);
  let x = -10;
  const buildings = Array.from({ length: 9 }).map((_, i) => {
    const w = 26 + rand() * 20;
    const h = 40 + rand() * 110;
    const rect = { w, h, i, x };
    x += w - 4;
    return rect;
  });

  let rects = "";
  buildings.forEach((b) => {
    rects += `<rect x="${b.x}" y="${225 - b.h}" width="${b.w}" height="${b.h}" fill="hsl(${hue} 30% ${10 + b.i * 1.5}%)" stroke="hsl(${hue} 40% 20%)" stroke-width="0.5" />`;
    const rowsN = Math.floor(b.h / 18);
    const colsN = Math.max(1, Math.floor(b.w / 10));
    for (let wy = 0; wy < rowsN; wy++) {
      for (let wx = 0; wx < colsN; wx++) {
        const lit = rand() > 0.45;
        rects += `<rect x="${b.x + 4 + wx * 9}" y="${225 - b.h + 6 + wy * 16}" width="4" height="6" fill="${lit ? 'hsl(38 92% 65%)' : `hsl(${hue} 20% 22%)`}" opacity="${lit ? 0.85 : 0.4}" />`;
      }
    }
  });

  return `<svg viewBox="0 0 400 225" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="hsl(${hue} 45% 14%)" />
        <stop offset="100%" stop-color="hsl(${hue} 55% 6%)" />
      </linearGradient>
      <radialGradient id="sun" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#f97316" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
      </radialGradient>
    </defs>
    <rect width="400" height="225" fill="url(#sky)" />
    <circle cx="320" cy="55" r="70" fill="url(#sun)" />
    <circle cx="320" cy="55" r="16" fill="#f97316" opacity="0.85" />
    ${rects}
    <rect x="0" y="219" width="400" height="6" fill="hsl(${hue} 40% 4%)" />
  </svg>`;
}

function escapeHtml(str) {
  return (str || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(`${iso}T12:00:00`);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric" });
}

function renderPreview() {
  const title = document.getElementById("f-title").value;
  const summary = document.getElementById("f-summary").value;
  const author = document.getElementById("f-author").value;
  const date = document.getElementById("f-date").value;
  const readTime = document.getElementById("f-readtime").value;
  const tags = state.tags;
  const firstColor = TOPIC_COLORS[tags[0]];
  const hue = firstColor ? firstColor.h : 30;

  const bodyHtml = state.blocks.map((b) => {
    if (b.type === "paragraph") {
      return b.text.trim() ? `<p>${escapeHtml(b.text)}</p>` : "";
    }
    if (b.type === "quote") {
      return b.text.trim() ? `<div class="p-quote"><span class="mark">&ldquo;</span><p>${escapeHtml(b.text)}</p></div>` : "";
    }
    if (b.type === "stats") {
      const items = (b.items || []).filter((it) => it.value || it.label);
      if (!b.title && items.length === 0) return "";
      const grid = items.map((it) => `<div><p class="sval">${escapeHtml(it.value)}</p><p class="slabel">${escapeHtml(it.label)}</p></div>`).join("");
      return `<div class="p-stats"><p class="stitle"># ${escapeHtml(b.title || "Infografía")}</p><div class="sgrid">${grid}</div></div>`;
    }
    return "";
  }).join("");

  const tagsHtml = tags.map((t) => `<span>${escapeHtml(t)}</span>`).join("");

  document.getElementById("preview").innerHTML = `
    ${tags.length ? `<div class="p-tags">${tagsHtml}</div>` : ""}
    <h1 class="p-title">${title ? escapeHtml(title) : '<span class="empty-hint">Sin título todavía…</span>'}</h1>
    ${summary ? `<p class="p-summary">${escapeHtml(summary)}</p>` : ""}
    <div class="p-meta">
      <span>${escapeHtml(author || "Redacción ciudadhub")}</span>
      <span>${formatDate(date) || "Sin fecha"}</span>
      <span>${escapeHtml(readTime || "")}</span>
    </div>
    <div class="p-cover">${coverSvg(hue, title || "ciudadhub")}</div>
    <div class="p-body">${bodyHtml || '<p class="empty-hint">Agregá bloques de contenido para verlos acá.</p>'}</div>
    ${tags.length ? `<div class="p-endtags">${tagsHtml}</div>` : ""}
  `;
}

["f-title", "f-summary", "f-author", "f-date", "f-readtime"].forEach((id) => {
  document.getElementById(id).addEventListener("input", renderPreview);
});

document.getElementById("f-date").valueAsDate = new Date();

document.getElementById("post-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const statusEl = document.getElementById("status");
  statusEl.className = "";
  statusEl.textContent = "";

  const payload = {
    title: document.getElementById("f-title").value.trim(),
    summary: document.getElementById("f-summary").value.trim(),
    author: document.getElementById("f-author").value.trim(),
    date: document.getElementById("f-date").value,
    readTime: document.getElementById("f-readtime").value.trim(),
    tags: state.tags,
    blocks: state.blocks,
  };

  const submitBtn = e.target.querySelector(".primary");
  submitBtn.disabled = true;
  submitBtn.textContent = "Publicando…";

  try {
    const res = await fetch("/api/posts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      statusEl.className = "err";
      statusEl.textContent = (data.errors || ["Error desconocido."]).join("\n");
    } else {
      statusEl.className = "ok";
      statusEl.innerHTML = `Artículo publicado en <strong>lib/blog-data.ts</strong>. Con el servidor de Next corriendo, vas a poder verlo en <a href="http://localhost:3000${data.url}" target="_blank">localhost:3000${data.url}</a>.`;
      e.target.reset();
      state.tags = [];
      state.blocks = [];
      document.querySelectorAll(".tag-check").forEach((c) => (c.checked = false));
      document.getElementById("f-author").value = "Redacción ciudadhub";
      document.getElementById("f-readtime").value = "6 min";
      document.getElementById("f-date").valueAsDate = new Date();
      renderBlocks();
      renderPreview();
    }
  } catch (err) {
    statusEl.className = "err";
    statusEl.textContent = "No se pudo conectar con el servidor local (¿está corriendo node scripts/admin-server.mjs?).";
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Publicar artículo";
  }
});

loadTopics();
renderBlocks();
renderPreview();
</script>
</body>
</html>
